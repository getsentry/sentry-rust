[package]
name = "sentry-minidump"
version = "0.49.3"
authors = { workspace = true }
license = "MIT"
readme = "README.md"
repository = { workspace = true }
homepage = { workspace = true }
description = """
Sentry integration for capturing native crashes as minidumps.
"""
edition = { workspace = true }
rust-version = { workspace = true }

[lints]
workspace = true

[features]
default = []
# Sends the scope of the crashing thread instead of the main hub's scope.
# Every hub switch then also updates a registry of threads.
scope = ["sentry-core/thread-registry"]

[[example]]
name = "minidump"
path = "examples/app.rs"

[[example]]
name = "minidump-deprecated"
path = "examples/deprecated.rs"

[[example]]
name = "minidump-large-scope"
path = "examples/large_scope.rs"

[dependencies]
sentry-core = { workspace = true, features = ["client"] }
minidumper-child = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
libc = { workspace = true }
mach2 = { workspace = true }

[dev-dependencies]
sentry = { workspace = true, features = ["test", "ureq"] }
sadness-generator = { workspace = true }
