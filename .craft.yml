minVersion: 3.9.0
changelog:
  policy: auto
preReleaseCommand: bash scripts/bump-version.sh
versioning:
  policy: manual
artifactProvider:
  name: none
targets:
  - name: crates
    noDevDeps: true
  - name: github
  - name: registry
    sdks:
      cargo:sentry:
        apiDocsUrl: https://docs.rs/sentry
